name: Papaya Multiplatform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 libvulkan-dev python3 python3-pip libx11-dev libgl1-mesa-dev gcc-mingw-w64-x86-64 xvfb mesa-utils

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPAPAYA_BUILD_TESTS=ON

      - name: Compile Papaya
        run: |
          cmake --build build --parallel

      - name: Execute CTest Test Suites (18 Tests)
        run: |
          ctest --test-dir build --output-on-failure

      - name: Build Guest Verification Suite
        run: |
          scripts/build_guests.sh

      - name: Verify Guest Suite Under Papaya Runtime (Xvfb)
        run: |
          PAPAYA_RUNNER="xvfb-run -a" scripts/verify_guests.sh

      - name: Run Python Daemon Integration Tests
        run: |
          python3 tests/test_daemon.py

      - name: Test TUI Dashboard
        run: |
          python3 src/orchestrator/python/papaya_tui.py --once
