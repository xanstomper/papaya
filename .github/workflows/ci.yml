name: Papaya Multiplatform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 libvulkan-dev python3 python3-pip

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPAPAYA_BUILD_TESTS=ON

      - name: Compile Papaya
        run: |
          cmake --build build --parallel

      - name: Execute CTest Test Suites (17 Tests)
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python Daemon Integration Tests
        run: |
          python3 tests/test_daemon.py

      - name: Test TUI Dashboard
        run: |
          python3 src/orchestrator/python/papaya_tui.py --once
